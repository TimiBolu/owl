[package]
name = "owl-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Owl as a network service: OQL, prepared inserts and transactions over HTTP"

[lib]
name = "owl_server"
path = "src/lib.rs"

[[bin]]
name = "owl-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
owl_db = { path = "../..", features = ["s3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
