[package]
name = "owl-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Owl in a browser: the engine compiled to WebAssembly, its database in memory or kept in the browser's own file system"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1.3"
owl_db = { path = "../.." }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

# The build is not run through wasm-opt: it is one more tool to fetch, and the
# size it saves is for when this ships, not for showing that it runs.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
