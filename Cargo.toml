[package]
name = "owl_db"
version = "0.1.0"
edition = "2021"
autotests = false
autoexamples = false
autobenches = false

[workspace]
members = [".", "apps/loggr"]
resolver = "2"

[features]
default = []
legacy-tests = []

[dependencies]
# Core serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.3"
lz4_flex = "0.11"

# Storage engine serialization. The storage implementation is owned entirely by
# this Rust crate; there is no native/FFI storage dependency.
bincode = "1.3"

# Note: RocksDB dependency has been removed as of November 2025
# If you need RocksDB support, use an older version of OQL or contact maintainers

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
toml = "0.8"
num_cpus = "1.0"
clap = { version = "4.0", features = ["derive"] }

# Distributed systems
wyhash = "0.5"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
lazy_static = "1.4"
rayon = "1.10"
tempfile = "3.0"

# Parsing
nom = "7.1"

# Encoding
base64 = "0.21"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "run_complete_e2e_test"
path = "examples/run_complete_e2e_test.rs"

[[example]]
name = "verify_saved_data"
path = "examples/verify_saved_data.rs"

[[example]]
name = "show_data_demo"
path = "examples/show_data_demo.rs"

[[example]]
name = "test_simple_ref"
path = "examples/test_simple_ref.rs"

[[example]]
name = "test_deep_nesting"
path = "examples/test_deep_nesting.rs"

[[example]]
name = "batch_insert_demo"
path = "examples/batch_insert_demo.rs"

[[example]]
name = "show_support_search_output"
path = "examples/show_support_search_output.rs"

[[bin]]
name = "owl-admin"
path = "src/bin/owl-admin.rs"

[[bin]]
name = "owl-scale"
path = "src/bin/owl-scale.rs"

[[bin]]
name = "owl-reference-scale"
path = "src/bin/owl-reference-scale.rs"

[[test]]
name = "oql_examples_parse_test"
path = "tests/oql_examples_parse_test.rs"

[[test]]
name = "oql_dual_representation_test"
path = "tests/oql_dual_representation_test.rs"

[[bench]]
name = "index_scan_bench"
path = "benches/index_scan_bench.rs"
harness = false

[[bench]]
name = "ingest_bench"
path = "benches/ingest_bench.rs"
harness = false

[[bench]]
name = "navigation_bench"
path = "benches/navigation_bench.rs"
harness = false
